<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD Service | Acces securise</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="auth-title">
      <a class="brand auth-brand" href="index.html">
        <img src="image/logos.jpg" alt="" class="brand-logo">
        <span>DD Service</span>
      </a>
      <p class="eyebrow">Espace administrateur</p>
      <h1 id="auth-title">Connexion au tableau de bord</h1>
      <p class="auth-copy">
        Entrez votre mot de passe pour ouvrir l'espace de gestion du stock.
        L'acces est verifie par le serveur.
      </p>

      <form id="loginForm" class="auth-form">
        <label for="identifier">Nom ou identifiant <span>(facultatif pour les comptes de secours)</span></label>
        <input type="text" id="identifier" autocomplete="username" placeholder="Identifiant du compte">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button class="button primary" type="submit">Se connecter</button>
        <p class="form-message" id="message" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
